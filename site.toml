[site]
title = "Borders"
out = "docs"
resource_prefix = "https://borders.lod4hss.org/resource/"
label_predicate = "https://sdhss.org/ontology/shortcuts/P9"
# Vendored from lod4hss-projects/borders @ shacl_files so this directory is
# self-contained: `cp -r sites/borders <new repo>` has to build on its own.
shapes = [
  "shapes/shacl-Construction - Type ongoing.ttl",
  "shapes/profile-Construction - Location light ongoing-1.ttl",
  "shapes/shacl-Construction - Production and Destruction ongoing (1).ttl",
  "shapes/shacl-Geographical Place - Geocoordonates Light ongoing.ttl",
  "shapes/profile-Geographical Place - Type ongoing-1.ttl",
  "shapes/profile-Group - Type -1.ttl",
  "shapes/shacl-Group - Formation and Dissolution events.ttl",
  "shapes/use.ttl",
  "traversals.ttl",
  "views.ttl",
]

[endpoint]
url = "https://sparql-gdb.lod4hss.org/borders"

[map]
url = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}"
attribution = "Tiles &copy; <a href=\"https://www.esri.com/\">Esri</a>"
max_zoom = 13
